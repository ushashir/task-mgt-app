repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        # language: system, not the mirrors-mypy repo's isolated venv --
        # that venv only sees whatever's listed in additional_dependencies,
        # which drifted from requirements.txt and produced dozens of false
        # "Library stubs not installed" / "has type Any" errors on files
        # that pass cleanly under the project's actual mypy config. Running
        # from the activated project venv (same as CI does) is the only
        # way this hook agrees with `mypy app/` run directly.
        entry: mypy app/
        language: system
        pass_filenames: false
        types: [python]
