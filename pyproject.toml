[project]
name = "task-management-api"
version = "0.1.0"
description = "Task Management System REST API"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends(...) as a default argument is intentional

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no external services, repositories mocked/faked",
    "integration: hits a real Postgres and Redis, rolled back per test",
    "api: full request/response cycle via httpx.AsyncClient",
]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
# Coverage is chased on service and core layers, per the design doc (Section 16) --
# routers, ORM models, and schemas are declarative and not worth chasing for coverage.
omit = ["app/main.py", "*/router.py", "*/models.py", "*/schemas.py", "alembic/*"]

[tool.coverage.report]
fail_under = 80
