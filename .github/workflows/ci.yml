name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"
  # Safe, non-secret values for a throwaway CI run -- no real Gmail account
  # or production JWT key involved. SMTP failures are caught and logged
  # (app/notifications/email_sender.py), never raised, so a fake Gmail
  # account is enough for tests to pass.
  DATABASE_URL: postgresql+asyncpg://taskuser:taskpass@localhost:5432/taskdb_test
  REDIS_URL: redis://localhost:6379/1
  JWT_SECRET_KEY: ci-only-secret-never-used-outside-this-workflow
  GMAIL_USER: ci@example.com
  GMAIL_APP_PASSWORD: ci-placeholder-app-password

jobs:
  lint-typecheck-unit:
    name: Lint, format, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black --check
        run: black --check .

      - name: isort --check-only
        run: isort --check-only .

      - name: mypy
        run: mypy app/

      # Fast tier, no services -- runs first so failures surface quickly
      # (Section 17, step 4).
      - name: Unit tests
        run: pytest -m unit --no-cov

  integration-and-api-tests:
    name: Integration + API tests (coverage gate)
    runs-on: ubuntu-latest
    needs: lint-typecheck-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations against the test database
        run: alembic upgrade head

      # Coverage gate (pytest-cov, configured in pyproject.toml) fails the
      # job if coverage drops below 80% -- Section 17, step 6.
      - name: Integration + API tests with coverage
        run: pytest -m "integration or api"

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit, integration-and-api-tests]
    steps:
      - uses: actions/checkout@v4

      # Confirms the image builds cleanly; not pushed anywhere on PRs or
      # pushes to dev -- only a merge to main publishes (see below).
      - name: Build image
        run: docker build -t task-management-api:ci-check .

  publish-to-ghcr:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest
    needs: [lint-typecheck-unit, integration-and-api-tests, docker-build-check]
    # Publishes on a push to either environment branch: dev -> staging
    # image, main -> production image. Actually deploying that image
    # (Softkloud) is a separate, not-yet-automated step -- see README's
    # "Deployment" section for the current manual process and what's
    # pending there.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:prod-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/${{ github.repository }}:dev,ghcr.io/${{ github.repository }}:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
